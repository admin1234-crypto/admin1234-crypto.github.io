<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dodo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' fill='%23000' stroke='%23555' stroke-width='1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #e9e9e9;
    --glow: rgba(255,255,255,.35);
    --text: #ececec;
    --muted: rgba(236,236,236,.55);
    --card: rgba(8,8,8,.32);
    --border: rgba(255,255,255,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #050505;
    color: var(--text);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    font-weight: 300;
    overflow: hidden;
  }

  /* ---------- Фон ---------- */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  #bg img, #bg video { width: 100%; height: 100%; object-fit: cover; }
  #bg .fallback {
    width: 100%; height: 100%;
    background:
      radial-gradient(circle at 30% 35%, #3a3a3a 0, transparent 50%),
      radial-gradient(circle at 75% 70%, #222 0, transparent 50%),
      #050505;
    animation: drift 18s ease-in-out infinite alternate;
    background-size: 140% 140%;
  }
  @keyframes drift { to { background-position: 100% 100%; } }
  #bg video, #bg img { filter: grayscale(1) contrast(1.05); }
  #shade {
    position: fixed; inset: 0; z-index: 1;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.65) 100%),
      rgba(0,0,0,var(--dim, .35));
  }
  /* зерно плёнки */
  #grain {
    position: fixed; inset: -50%; z-index: 1; pointer-events: none; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
  }
  @keyframes grain { 0%{transform:translate(0,0)} 33%{transform:translate(-3%,2%)} 66%{transform:translate(2%,-3%)} 100%{transform:translate(0,0)} }

  /* ---------- Заставка ---------- */
  #enter {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: rgba(0,0,0,.9);
    backdrop-filter: blur(18px);
    cursor: pointer;
    transition: opacity .7s ease;
  }
  #enter span {
    font-family: "Cormorant Garamond", serif; font-style: italic;
    font-size: 1.3rem; letter-spacing: .25em; text-transform: lowercase;
    color: var(--muted);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  #enter.hide { opacity: 0; pointer-events: none; }

  /* ---------- Карточка ---------- */
  main {
    position: relative; z-index: 2;
    height: 100%;
    display: grid; place-items: center;
    padding: 16px;
  }
  .card {
    width: min(440px, 100%);
    padding: 32px 28px 24px;
    border-radius: 22px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(var(--blur, 10px));
    -webkit-backdrop-filter: blur(var(--blur, 10px));
    box-shadow: 0 20px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    text-align: center;
    opacity: 0; transform: translateY(16px) scale(.98);
    transition: opacity .8s ease, transform .8s ease;
  }
  body.entered .card { opacity: 1; transform: none; }

  /* Физика карточки: наклон за курсором, блик, мягкая тень */
  main { perspective: 900px; }
  #tilt {
    width: min(440px, 100%);
    will-change: transform;
    touch-action: pan-y;
  }
  #tilt .card { width: 100%; position: relative; overflow: hidden; }
  .card > *:not(.glare) { position: relative; z-index: 1; }
  .glare {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(420px circle at var(--gx, 50%) var(--gy, 0%), rgba(255,255,255,.13), transparent 60%);
    opacity: var(--go, 0);
    transition: opacity .4s ease;
  }
  .card::after {   /* тонкий светящийся край, который ярче со стороны курсора */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
    padding: 1px;
    background: radial-gradient(300px circle at var(--gx, 50%) var(--gy, 0%), rgba(255,255,255,.55), transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: var(--go, 0); transition: opacity .4s ease;
  }

  /* 1. Дыхание 4-7-8: вдох 4 с, задержка 7 с, выдох 8 с (весь круг 19 с).
     Свет — неровное «живое» пятно: форма плавно меняется и медленно вращается, поэтому круг никогда не бывает ровным */
  .avatar-wrap { position: relative; width: 96px; height: 96px; margin: 0 auto 14px; }
  .avatar-wrap .avatar { margin: 0; position: relative; z-index: 1; box-shadow: 0 0 10px rgba(255,255,255,.15); }
  .avatar-wrap .avatar { background: #0c0c0c; }
  .aura {
    position: absolute; inset: -4px; z-index: 0; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255,255,255,.6), rgba(255,255,255,.22) 65%, transparent);
    filter: blur(7px);
    border-radius: 34% 66% 62% 38% / 58% 32% 68% 42%;
    animation: breathe 19s ease-in-out infinite, morph 9s ease-in-out infinite alternate, spin 23s linear infinite;
  }
  .aura.a2 {
    inset: -10px; filter: blur(12px); opacity: .6;
    animation: breathe 19s ease-in-out infinite -0.8s, morph2 13s ease-in-out infinite alternate, spin 37s linear infinite reverse;
  }
  .aura.a3 {
    inset: 0; filter: blur(4px);
    background: radial-gradient(closest-side, transparent 70%, rgba(255,255,255,.55) 86%, transparent);
    animation: breathe 19s ease-in-out infinite -0.3s, morph 6s ease-in-out infinite alternate-reverse, spin 17s linear infinite;
  }
  @keyframes breathe {
    0%   { scale: .92;  opacity: .3; }
    21%  { scale: 1.3;  opacity: 1; }
    58%  { scale: 1.34; opacity: .9; }
    100% { scale: .92;  opacity: .3; }
  }
  @keyframes morph {
    0%   { border-radius: 34% 66% 62% 38% / 58% 32% 68% 42%; translate: 3px -2px; }
    25%  { border-radius: 62% 38% 30% 70% / 36% 64% 40% 60%; translate: -4px 2px; }
    50%  { border-radius: 40% 60% 70% 30% / 66% 38% 62% 34%; translate: 2px 4px; }
    75%  { border-radius: 70% 30% 46% 54% / 30% 60% 40% 70%; translate: -2px -4px; }
    100% { border-radius: 48% 52% 34% 66% / 62% 30% 70% 38%; translate: 4px 1px; }
  }
  @keyframes morph2 {
    0%   { border-radius: 60% 40% 36% 64% / 40% 66% 34% 60%; translate: -5px 3px; }
    50%  { border-radius: 32% 68% 58% 42% / 64% 36% 60% 40%; translate: 5px -4px; }
    100% { border-radius: 66% 34% 52% 48% / 34% 58% 42% 66%; translate: -3px -5px; }
  }
  @keyframes spin { to { rotate: 360deg; } }
  /* 2. Частицы */
  #particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { #tilt { transform: none !important; } }
  @media (prefers-reduced-motion: reduce) { .aura { animation: none; } }

  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    margin: 0 auto 14px;
    border: 1px solid rgba(255,255,255,.55);
    box-shadow: 0 0 22px var(--glow);
    font-family: "Cormorant Garamond", serif; font-weight: 500;
    object-fit: cover;
    display: grid; place-items: center;
    font-size: 2.4rem; font-weight: 700;
    background: rgba(255,255,255,.06);
  }
  .nick {
    font-family: "Cormorant Garamond", serif;
    font-size: 3.2rem; font-weight: 500; letter-spacing: .08em;
    text-shadow: 0 0 10px var(--glow), 0 0 34px rgba(255,255,255,.18);
  }
  .role {
    margin-top: 6px; min-height: 1.4em;
    color: var(--muted); font-size: .9rem; letter-spacing: .12em; text-transform: lowercase;
  }
  .role .cursor { display: inline-block; width: 1px; background: var(--muted); margin-left: 2px; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Вкладки */
  .tabs { display: flex; gap: 6px; justify-content: center; margin: 22px 0 16px; }
  .tabs button {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 18px; font: inherit; font-size: .8rem; letter-spacing: .14em; text-transform: lowercase; cursor: pointer;
    transition: all .2s;
  }
  .tabs button.active, .tabs button:hover { color: var(--text); border-color: rgba(255,255,255,.45); background: rgba(255,255,255,.05); box-shadow: 0 0 12px rgba(255,255,255,.08); }
  .panel { display: none; animation: fade .35s ease; }
  .panel.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }

  /* Соцсети */
  .socials { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .socials a {
    width: 46px; height: 46px; border-radius: 14px;
    display: grid; place-items: center;
    color: var(--text);
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    transition: transform .3s, box-shadow .3s, border-color .3s;
  }
  .socials a:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.5); box-shadow: 0 0 18px var(--glow); }
  .socials svg { width: 20px; height: 20px; fill: currentColor; opacity: .85; }

  .about { text-align: left; line-height: 1.75; color: rgba(236,236,236,.85); font-size: .92rem; white-space: pre-line; }

  .views { margin-top: 20px; font-size: .8rem; color: var(--muted); }

  /* Кнопка звука */
  #sound {
    position: fixed; top: 16px; right: 16px; z-index: 5;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); cursor: pointer;
    display: grid; place-items: center;
    backdrop-filter: blur(8px);
    opacity: 0; transition: opacity .6s;
  }
  body.entered #sound { opacity: 1; }
  #sound svg { width: 20px; height: 20px; fill: currentColor; }
  #volume {
    position: fixed; top: 28px; right: 70px; z-index: 5; width: 90px;
    accent-color: #d8d8d8;
    opacity: 0; transition: opacity .6s;
  }
  body.entered #volume { opacity: .8; }
  .track { position: fixed; bottom: 14px; left: 0; right: 0; z-index: 5; text-align: center; font-size: .75rem; letter-spacing: .12em; color: var(--muted); opacity: 0; transition: opacity .6s; }
  body.entered .track { opacity: 1; }
</style>

// Анимация названия вкладки: цикл из нескольких эффектов
(function tabTitle() {
  const W = C.nick, B = "⠀";                 // B — невидимый символ, браузер не съедает его как пробел
  const GL = "░▒▓█▚▞#%&@$*/\\<>";
  const rnd = (n) => Array.from({ length: n }, () => GL[Math.random() * GL.length | 0]).join("");
  const hold = (t, n) => Array(n).fill(t);
  const scenes = [
    // 1. расшифровка: шум превращается в ник слева направо
    () => {
      const f = [];
      for (let k = 0; k < 4; k++) f.push(rnd(W.length));
      for (let i = 1; i <= W.length; i++) for (let k = 0; k < 2; k++) f.push(W.slice(0, i) + rnd(W.length - i));
      return f.concat(hold(W, 5));
    },
    // 2. волна: заглавная буква бежит по нику туда и обратно
    () => {
      const lo = W.toLowerCase(), f = [];
      const at = (i) => lo.slice(0, i) + lo[i].toUpperCase() + lo.slice(i + 1);
      for (let r = 0; r < 2; r++) {
        for (let i = 0; i < lo.length; i++) f.push(at(i));
        for (let i = lo.length - 2; i > 0; i--) f.push(at(i));
      }
      return f.concat(hold(W, 3));
    },
    // 3. искры вокруг ника
    () => ["✧" + B + W, "✦" + B + W + B + "✧", "✧" + B + W + B + "✦", B + W + B + "✧", "⋆" + B + W + B + "⋆",
           "✦" + B + W, "✧" + B + W + B + "✦", B + W + B + "✦", "⋆" + B + W + B + "⋆", W].concat(hold(W, 3)),
    // 4. ник уезжает за край и выезжает обратно
    () => {
      const f = [], pad = B.repeat(W.length);
      for (let i = 1; i <= W.length; i++) f.push(W.slice(i) || "▏");
      f.push("▏", "▏");
      for (let i = 1; i <= W.length; i++) f.push(W.slice(0, i));
      return f.concat(hold(W, 4));
    },
    // 5. глитч: ник рассыпается в блоки и собирается
    () => {
      const f = [];
      for (let k = 0; k < 3; k++) { f.push(W); f.push(W.split("").map((c) => Math.random() < .5 ? rnd(1) : c).join("")); }
      f.push(rnd(W.length), "▓▒░" , "░", "▁▂▃", "▃▅▇", rnd(W.length));
      return f;
    },
  ];
  let frames = [], f = 0, sc = 0;
  setInterval(() => {
    if (f >= frames.length) { frames = scenes[sc](); sc = (sc + 1) % scenes.length; f = 0; }
    document.title = frames[f++];
  }, 170);
})();

function typeRoles() {

// Музыка
// Играем через Web Audio: так повтор идёт без паузы на стыке.
// Если браузер не смог (например, файл открыт с диска), используем обычный <audio loop>.
const audio = $("audio");
let muted = false, vol = Number(C.volume), gain = null, useFallback = false;
if (!C.music) { $("sound").style.display = "none"; $("volume").style.display = "none"; }
$("volume").value = vol;
const applyVolume = () => {
  const v = muted ? 0 : vol;
  if (gain) gain.gain.setTargetAtTime(v, gain.context.currentTime, 0.05);
  audio.volume = v;
};
const drawSound = () => $("sound").innerHTML = muted ? SOUND_OFF : SOUND_ON;
drawSound();
$("sound").onclick = () => { muted = !muted; drawSound(); applyVolume(); };
$("volume").oninput = (e) => { vol = Number(e.target.value); if (muted && vol > 0) { muted = false; drawSound(); } applyVolume(); };

async function startMusic() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    const data = await (await fetch(C.music)).arrayBuffer();
    const buf = await ctx.decodeAudioData(data);
    // начало звука (пропускаем тишину в начале файла)
    const ch = buf.getChannelData(0);
    let on = 0; while (on < ch.length && Math.abs(ch[on]) < 0.01) on++;
    const onset = on / buf.sampleRate;
    // Петля: от loop.start до loop.end (секунды от первого звука), стык сглажен перекрёстным переходом
    const lp = C.musicLoop, sr = buf.sampleRate;
    let out = buf;
    if (lp && lp.end > lp.start) {
      const s0 = Math.round((onset + lp.start) * sr), e0 = Math.min(Math.round((onset + lp.end) * sr), buf.length);
      const len = e0 - s0, X = Math.min(Math.round((lp.fade || 0.3) * sr), s0, len);
      out = ctx.createBuffer(buf.numberOfChannels, len, sr);
      for (let c = 0; c < buf.numberOfChannels; c++) {
        const d = buf.getChannelData(c), o = out.getChannelData(c);
        o.set(d.subarray(s0, e0));
        for (let k = 0; k < X; k++) {
          const f = k / X;
          o[len - X + k] = d[e0 - X + k] * (1 - f) + d[s0 - X + k] * f;
        }
      }
    }
    const src = ctx.createBufferSource();
    src.buffer = out; src.loop = true;
    gain = ctx.createGain(); gain.gain.value = 0;
    src.connect(gain).connect(ctx.destination);
    src.start();
    applyVolume();
    window.__music = { ctx, buf: out };
  } catch (e) {
    useFallback = true;
    audio.src = C.music; audio.loop = true; applyVolume();
    audio.play().catch(() => {});
  }
}

// Физика карточки: пружина тянет наклон к позиции курсора, при уходе карточка мягко возвращается
(function () {
  const el = $("tilt"), card = el.querySelector(".card");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const MAX = 14;          // максимальный наклон, градусы
  const K = 140, D = 13;   // жёсткость и затухание пружины
  const S = { rx: 0, ry: 0, tx: 0, ty: 0, z: 0 }, V = { rx: 0, ry: 0, tx: 0, ty: 0, z: 0 };
  let T = { rx: 0, ry: 0, tx: 0, ty: 0, z: 0 }, active = false, last = performance.now();

  function aim(x, y) {
    const r = card.getBoundingClientRect();
    const nx = Math.max(-1, Math.min(1, (x - r.left) / r.width * 2 - 1));
    const ny = Math.max(-1, Math.min(1, (y - r.top) / r.height * 2 - 1));
    T = { rx: -ny * MAX, ry: nx * MAX, tx: nx * 8, ty: ny * 8, z: 30 };
    card.style.setProperty("--gx", ((x - r.left) / r.width * 100) + "%");
    card.style.setProperty("--gy", ((y - r.top) / r.height * 100) + "%");
    card.style.setProperty("--go", 1);
    active = true;
  }
  function release() { T = { rx: 0, ry: 0, tx: 0, ty: 0, z: 0 }; card.style.setProperty("--go", 0); active = false; }

  // реагирует, когда курсор над карточкой или рядом с ней
  addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") return;
    const r = card.getBoundingClientRect(), pad = 60;
    if (e.clientX > r.left - pad && e.clientX < r.right + pad && e.clientY > r.top - pad && e.clientY < r.bottom + pad) aim(e.clientX, e.clientY);
    else if (active) release();
  });
  document.addEventListener("pointerleave", release);
  // на телефоне карточка наклоняется под пальцем и пружинит обратно, когда палец отпущен
  card.addEventListener("touchstart", (e) => aim(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  card.addEventListener("touchmove", (e) => aim(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  card.addEventListener("touchend", release);
  card.addEventListener("touchcancel", release);
  // лёгкий толчок при клике, как будто карточку нажали
  card.addEventListener("pointerdown", () => { V.z -= 260; });

  function frame(now) {
    const dt = Math.min(0.032, (now - last) / 1000); last = now;
    const idle = active ? 0 : 1, t = now / 1000;
    for (const k in S) {
      let target = T[k];
      if (k === "rx") target += idle * Math.sin(t * 0.7) * 1.2;   // спокойное «дыхание» без курсора
      if (k === "ry") target += idle * Math.cos(t * 0.5) * 1.6;
      if (k === "ty") target += idle * Math.sin(t * 0.9) * 3;
      V[k] += ((target - S[k]) * K - V[k] * D) * dt;
      S[k] += V[k] * dt;
    }
    el.style.transform = `translate3d(${S.tx}px, ${S.ty}px, ${S.z}px) rotateX(${S.rx}deg) rotateY(${S.ry}deg)`;
    card.style.boxShadow = `${-S.ry * 1.5}px ${20 + S.rx * 1.5}px ${80 + S.z}px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// 2. Пылинки и листья: медленно плывут, от курсора разлетаются, как от ветра
(function particles() {
  const cv = $("particles"), cx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, dpr, P = [];
  const mouse = { x: -9999, y: -9999, vx: 0, vy: 0 };
  function make(leaf) {
    return {
      x: Math.random() * W, y: Math.random() * H,
      vx: 0, vy: 0, leaf,
      r: leaf ? 3 + Math.random() * 3 : 0.6 + Math.random() * 1.4,
      a: leaf ? 0.25 + Math.random() * 0.2 : 0.15 + Math.random() * 0.35,
      rot: Math.random() * 6.28, spin: (Math.random() - .5) * 0.02,
      ph: Math.random() * 6.28, sp: leaf ? 0.25 + Math.random() * 0.25 : 0.08 + Math.random() * 0.15,
    };
  }
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 16000);
    P = []; for (let i = 0; i < n; i++) P.push(make(i % 7 === 0));
  }
  resize(); addEventListener("resize", resize);
  addEventListener("pointermove", (e) => {
    mouse.vx = e.clientX - mouse.x; mouse.vy = e.clientY - mouse.y;
    mouse.x = e.clientX; mouse.y = e.clientY;
  });
  document.addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
  let t = 0;
  function draw() {
    t += 1;
    cx.clearRect(0, 0, W, H);
    for (const p of P) {
      if (!still) {
        // ветер: медленный дрейф вниз-вправо с покачиванием
        const wind = 0.15 + Math.sin(t * 0.003) * 0.1;
        let ax = wind * p.sp + Math.sin(t * 0.01 + p.ph) * 0.02, ay = p.sp * (p.leaf ? 0.6 : 0.35);
        // курсор отталкивает частицы
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy, R = 130;
        if (d2 < R * R) {
          const d = Math.sqrt(d2) || 1, f = (1 - d / R) * 1.6;
          ax += dx / d * f + mouse.vx * 0.02 * (1 - d / R);
          ay += dy / d * f + mouse.vy * 0.02 * (1 - d / R);
          p.spin += (Math.random() - .5) * 0.01;
        }
        p.vx = (p.vx + ax) * 0.92; p.vy = (p.vy + ay) * 0.92;
        p.x += p.vx; p.y += p.vy; p.rot += p.spin + (p.leaf ? Math.sin(t * 0.02 + p.ph) * 0.01 : 0);
        p.spin *= 0.99;
        if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
        if (p.x > W + 10) p.x = -10; if (p.x < -10) p.x = W + 10; if (p.y < -12) p.y = H + 10;
      }
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      if (p.leaf) {
        // лист: вытянутый овал с прожилкой, светится сильнее, когда разворачивается к зрителю
        const face = 0.35 + Math.abs(Math.sin(p.rot * 1.3)) * 0.65;
        cx.scale(1, face);
        cx.fillStyle = `rgba(225,225,225,${p.a})`;
        cx.beginPath(); cx.ellipse(0, 0, p.r * 1.8, p.r * 0.8, 0, 0, 6.283); cx.fill();
        cx.strokeStyle = `rgba(20,20,20,${p.a * 0.8})`; cx.lineWidth = 0.6;
        cx.beginPath(); cx.moveTo(-p.r * 1.6, 0); cx.lineTo(p.r * 1.6, 0); cx.stroke();
      } else {
        cx.fillStyle = `rgba(255,255,255,${p.a * (0.7 + 0.3 * Math.sin(t * 0.02 + p.ph))})`;
        cx.beginPath(); cx.arc(0, 0, p.r, 0, 6.283); cx.fill();
      }
      cx.restore();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

// 3. Мягкий глитч от клика: небольшой участок фона раскалывается на сдвинутые полосы и плавно собирается обратно
(function glitchClick() {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let actx = null;
  function tick() {   // мягкий звук: тёплый тихий звон с коротким «цифровым» дрожанием в начале
    if (typeof muted !== "undefined" && muted) return;
    const level = (typeof vol !== "undefined" ? vol : 0.4);
    if (level <= 0) return;
    try {
      actx = actx || (window.__music && window.__music.ctx) || new (window.AudioContext || window.webkitAudioContext)();
      actx.resume();
      const t = actx.currentTime;
      const out = actx.createGain(); out.gain.value = level;
      const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(500, t + 1.2);
      // дрожание: громкость быстро «мерцает» первые 0.12 с, как у глитча, потом звук спокойно тает
      const trem = actx.createGain();
      trem.gain.setValueAtTime(1, t);
      for (let k = 0; k < 4; k++) { trem.gain.setValueAtTime(0.35, t + 0.02 + k * 0.03); trem.gain.setValueAtTime(1, t + 0.035 + k * 0.03); }
      lp.connect(trem).connect(out).connect(actx.destination);
      // две ноты из пентатоники, тихо и чуть расстроенно — получается тёплый звон
      const notes = [392, 440, 523.25, 587.33, 659.25];
      const f = notes[Math.random() * notes.length | 0] / 2;
      [[f, 0.08], [f * 1.5, 0.035], [f * 2.003, 0.018]].forEach(([fr, a]) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = fr;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + 0.025);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
        o.connect(g).connect(lp); o.start(t); o.stop(t + 1.35);
      });
      // лёгкое «дуновение» шума
      const len = Math.floor(actx.sampleRate * 0.4), nb = actx.createBuffer(1, len, actx.sampleRate), d = nb.getChannelData(0);
      for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.sin(Math.PI * k / len);
      const n = actx.createBufferSource(), ng = actx.createGain(), nf = actx.createBiquadFilter();
      n.buffer = nb; nf.type = "lowpass"; nf.frequency.value = 700; ng.gain.value = 0.012;
      n.connect(nf).connect(ng).connect(out); n.start(t);
    } catch (e) {}
  }

  // что сейчас на фоне и как оно растянуто на экран (object-fit: cover)
  function source() {
    const v = document.querySelector("#bg video"), im = document.querySelector("#bg img");
    const el = (v && v.readyState >= 2) ? v : (im && im.complete && im.naturalWidth ? im : null);
    if (!el) return null;
    const sw = el.videoWidth || el.naturalWidth, sh = el.videoHeight || el.naturalHeight;
    const k = Math.max(innerWidth / sw, innerHeight / sh);
    return { el, k, ox: (innerWidth - sw * k) / 2, oy: (innerHeight - sh * k) / 2 };
  }

  function burst(x, y) {
    const S = 190, half = S / 2;
    const cv = document.createElement("canvas"), dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = cv.height = S * dpr;
    Object.assign(cv.style, { position: "fixed", left: (x - half) + "px", top: (y - half) + "px", width: S + "px", height: S + "px", zIndex: 1, pointerEvents: "none" });
    document.body.appendChild(cv);
    const cx = cv.getContext("2d"); cx.scale(dpr, dpr);
    const src = source(), dim = Number(C.backgroundDim) || 0;

    // полосы-разломы разной толщины, каждая со своим сдвигом
    const bands = []; let yy = 0;
    while (yy < S) {
      const h = 3 + Math.random() * 16, near = 1 - Math.abs(yy + h / 2 - half) / half;
      bands.push({ y: yy, h, dx: (Math.random() - .5) * 2 * (6 + 22 * near), lift: Math.random() < .25 ? .18 : 0, j: Math.random() * 6.28 });
      yy += h;
    }
    // пара «выбитых» блоков
    const blocks = Array.from({ length: 3 }, () => ({ x: 30 + Math.random() * (S - 90), y: 30 + Math.random() * (S - 70), w: 20 + Math.random() * 40, h: 4 + Math.random() * 10, dx: (Math.random() - .5) * 40 }));

    const T = 760, t0 = performance.now();
    function frame(now) {
      const t = (now - t0) / T;
      if (t >= 1) { cv.remove(); return; }
      // сила: резкий удар в начале, пара подёргиваний, затем мягкое затухание
      const amp = (t < .08 ? t / .08 : Math.pow(1 - (t - .08) / .92, 2.2)) * (t > .2 && t < .3 ? .55 : 1);
      cx.clearRect(0, 0, S, S);
      cx.globalCompositeOperation = "source-over";
      for (const b of bands) {
        const dx = b.dx * amp + Math.sin(now * 0.05 + b.j) * 1.5 * amp;
        if (src) {
          const sx = (x - half - dx - src.ox) / src.k, sy = (y - half + b.y - src.oy) / src.k;
          cx.drawImage(src.el, sx, sy, S / src.k, b.h / src.k, 0, b.y, S, b.h);
        } else {
          cx.fillStyle = `rgba(255,255,255,${0.04 + Math.random() * 0.05})`;
          cx.fillRect(dx, b.y, S, b.h);
        }
        if (b.lift) { cx.fillStyle = `rgba(255,255,255,${b.lift * amp})`; cx.fillRect(0, b.y, S, b.h); }
        // тонкий светлый шов на линии разлома
        cx.fillStyle = `rgba(255,255,255,${0.22 * amp})`; cx.fillRect(Math.max(0, dx), b.y, S, 0.6);
      }
      for (const k of blocks) {
        cx.fillStyle = `rgba(255,255,255,${0.10 * amp})`;
        cx.fillRect(k.x + k.dx * amp, k.y, k.w, k.h);
        cx.fillStyle = `rgba(0,0,0,${0.35 * amp})`;
        cx.fillRect(k.x - k.dx * amp * .5, k.y + k.h, k.w * .6, 2);
      }
      // монохром и то же затемнение, что у фона
      cx.globalCompositeOperation = "saturation"; cx.fillStyle = "#808080"; cx.fillRect(0, 0, S, S);
      cx.globalCompositeOperation = "source-atop"; cx.fillStyle = `rgba(0,0,0,${dim})`; cx.fillRect(0, 0, S, S);
      // мягкие края: участок растворяется к границам
      cx.globalCompositeOperation = "destination-in";
      const g = cx.createRadialGradient(half, half, 0, half, half, half);
      g.addColorStop(0, `rgba(0,0,0,${Math.min(1, amp * 1.2)})`); g.addColorStop(.55, `rgba(0,0,0,${amp * .8})`); g.addColorStop(1, "rgba(0,0,0,0)");
      cx.fillStyle = g; cx.fillRect(0, 0, S, S);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  addEventListener("pointerdown", (e) => {
    if (!document.body.classList.contains("entered")) return;
    if (e.target.closest(".card, a, button, input, #enter")) return;
    tick();
    if (!still) burst(e.clientX, e.clientY);
  });
})();

// Вход
$("enter").onclick = () => {
  $("enter").classList.add("hide");
  document.body.classList.add("entered");
  if (C.music) startMusic();
  const v = document.querySelector("#bg video"); if (v) v.play().catch(() => {});
  typeRoles();
};
</script>
</body>
</html>
